<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patrimoine V6</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#0a0a0b;--card:#131417;--card2:#1a1b1f;--tx:#f4f5f7;--mut:#8a8f98;--bd:#24262c;--ac:#f0c08a;--on:#1a1306;--up:#3ccf86;--dn:#ff6f66;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,system-ui,sans-serif;padding-bottom:110px}
#app{max-width:680px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.top h1{font-size:18px;margin:0;color:var(--ac)}
.avatar{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between}
.hero{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--bd);border-radius:24px;padding:20px;margin-bottom:12px}
.hero .amount{font-size:36px;font-weight:700;letter-spacing:-1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.kpi .k{font-size:11px;color:var(--mut);text-transform:uppercase}
.kpi .v{font-size:20px;font-weight:700;margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}.s{font-size:12px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;margin-bottom:8px}
.btn{width:100%;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--ac);font-weight:600;margin-top:8px;cursor:pointer}
.btn.primary{background:var(--ac);color:var(--on)}
#nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;background:rgba(19,20,23,.9);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:24px;padding:6px;z-index:50}
#nav button{flex:1;border:0;background:none;color:var(--mut);font-size:10px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:4px}
#nav button.on{color:var(--ac)}
#nav svg{width:20px;height:20px;fill:currentColor}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60}
.drawer{position:fixed;left:0;top:0;bottom:0;width:80%;max-width:320px;background:var(--card);padding:20px;z-index:61;overflow:auto}
.drawer button{display:block;width:100%;text-align:left;padding:14px;background:none;border:0;color:var(--tx);font-size:16px;border-radius:10px}
.drawer button:active{background:var(--bd)}
.chat{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.bubble{max-width:88%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.5}
.bubble.u{align-self:flex-end;background:var(--ac);color:var(--on)}
.bubble.a{align-self:flex-start;background:var(--card);border:1px solid var(--bd)}
.composer{position:fixed;left:12px;right:12px;bottom:calc(85px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.composer input{margin:0;border-radius:20px;padding:12px}
.composer button{border-radius:50%;width:44px;height:44px;background:var(--ac);color:var(--on);border:0;font-size:18px}
</style>
</head>
<body>
<div id="app"></div>
<div id="drawerRoot"></div>
<nav id="nav"></nav>
<script>
// --- BASE DE DONNÉES & CONSTANTES ---
const TAX = {T:[11600,29579,84577,181917], R:[0,0.11,0.30,0.41,0.45]};
const LIMITS = {PEA:150000, LIVRET_A:22950, LDDS:12000, LEP:10000};
const DEFAULT = () => ({
  accounts: [{id:'1', name:'Compte Courant', type:'cash', balance:2500}, {id:'2', name:'PEA', type:'invest', balance:15000}],
  transactions: [], loans: [], goals: [], docs: [], chat: [],
  apiKey: '', hide: false
});
let S = JSON.parse(localStorage.getItem('patrimoine-v6')) || DEFAULT();
let tab = 'home', cur = new Date().toISOString().slice(0,7), busy = false;

function save() { localStorage.setItem('patrimoine-v6', JSON.stringify(S)); draw(); }
const eur = n => S.hide ? '••••€' : Number(n).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});

// --- MOTEUR FISCAL ---
function calcTax(rev, parts=1) {
  let q = rev / parts, tax = 0, prev = 0;
  for(let i=0; i<5; i++) {
    let b = Math.max(0, Math.min(q, (TAX.T[i]||Infinity)) - prev);
    tax += b * TAX.R[i]; prev = TAX.T[i];
  }
  return Math.round(tax * parts);
}

// --- MOTEUR IA (DeepSeek) ---
async function askAI(prompt, isImg=false, imgData=null) {
  if(!S.apiKey) return "⚠️ Clé API DeepSeek manquante dans les Réglages.";
  const sys = "Tu es un expert financier. Tu as accès aux données: " + JSON.stringify(S.accounts) + ". Si on te demande d'ajouter une dépense, réponds avec le format JSON [ACTION: ADD_TX, {label, amount, category}].";
  let msgs = [{role:"system", content:sys}];
  if(isImg) msgs.push({role:"user", content:[{type:"text",text:prompt},{type:"image_url",image_url:{url:imgData}}]});
  else msgs.push({role:"user", content:prompt});
  
  try {
    let r = await fetch("https://api.deepseek.com/v1/chat/completions", {
      method:"POST", headers:{"Content-Type":"application/json","Authorization":`Bearer ${S.apiKey}`},
      body: JSON.stringify({model:"deepseek-chat", messages:msgs, temperature:0.2})
    });
    let d = await r.json();
    let txt = d.choices[0].message.content;
    
    // IA Actionnelle (si elle renvoie une action)
    if(txt.includes('[ACTION: ADD_TX')) {
      let json = JSON.parse(txt.split('ADD_TX,')[1].replace(']','').trim());
      S.transactions.push({id:Date.now(), date:cur, ...json});
      save();
      return "✅ J'ai ajouté la transaction : " + json.label + " (" + eur(json.amount) + ")";
    }
    return txt;
  } catch(e) { return "❌ Erreur IA: " + e.message; }
}

// --- VUES ---
function vHome() {
  let totalCash = S.accounts.reduce((a,b)=>a+b.balance, 0);
  let totalDebt = S.loans.reduce((a,b)=>a + (b.capital || 0), 0);
  let net = totalCash - totalDebt;
  return `
  <div class="hero"><div class="s mut">Patrimoine Net</div><div class="amount ${net>=0?'up':'dn'}">${eur(net)}</div></div>
  <div class="grid">
    <div class="kpi"><div class="k">Actifs</div><div class="v">${eur(totalCash)}</div></div>
    <div class="kpi"><div class="k">Dettes</div><div class="v dn">${eur(totalDebt)}</div></div>
    <div class="kpi"><div class="k">Liquidités</div><div class="v">${eur(S.accounts.filter(a=>a.type==='cash').reduce((x,y)=>x+y.balance,0))}</div></div>
    <div class="kpi"><div class="k">Investissements</div><div class="v">${eur(S.accounts.filter(a=>a.type==='invest').reduce((x,y)=>x+y.balance,0))}</div></div>
  </div>
  <div class="card"><h3>Dernières opérations</h3>
    ${S.transactions.slice(-4).reverse().map(t=>`<div class="row"><span>${t.label}</span><b class="dn">-${eur(t.amount)}</b></div>`).join('') || '<p class="s mut">Aucune opération.</p>'}
  </div>
  <button class="btn" onclick="go('ai')">Demander une analyse à l'IA</button>`;
}

function vAccounts() {
  return `<div class="card"><h3>Comptes Bancaires</h3>
    ${S.accounts.map(a=>`<div class="row"><span>${a.name}</span><b>${eur(a.balance)}</b></div>`).join('')}
    <input id="aName" placeholder="Nom (ex. Livret A)">
    <select id="aType"><option value="cash">Liquidités</option><option value="invest">Investissement</option><option value="estate">Immobilier</option></select>
    <input id="aBal" type="number" placeholder="Solde (€)">
    <button class="btn" onclick="addAcc()">+ Ajouter le compte</button>
  </div>
  <div class="card"><h3>Crédits & Dettes</h3>
    ${S.loans.map(l=>`<div class="row"><span>${l.name}</span><b class="dn">${eur(l.capital)}</b></div>`).join('')}
    <input id="lName" placeholder="Nom du prêt">
    <input id="lCap" type="number" placeholder="Capital restant (€)">
    <button class="btn" onclick="addLoan()">+ Ajouter le prêt</button>
  </div>`;
}

function vBudget() {
  let cats = ['Alimentation', 'Logement', 'Transport', 'Loisirs', 'Abonnements', 'Autres'];
  let spent = {};
  S.transactions.forEach(t => { spent[t.category] = (spent[t.category]||0) + t.amount; });
  return `<div class="card"><h3>Budget ${cur}</h3>
    ${cats.map(c=>`<div class="row"><span>${c}</span><b class="dn">${eur(spent[c]||0)}</b></div>`).join('')}
  </div>
  <div class="card"><h3>Ajouter une dépense</h3>
    <input id="txLabel" placeholder="Libellé (ex. Carrefour)">
    <input id="txAmt" type="number" placeholder="Montant (€)">
    <select id="txCat">${cats.map(c=>`<option>${c}</option>`).join('')}</select>
    <button class="btn" onclick="addTx()">Ajouter</button>
  </div>`;
}

function vTax() {
  return `<div class="card"><h3>Simulateur d'Impôt 2026</h3>
    <input id="tRev" type="number" placeholder="Revenu net imposable" oninput="calcT()">
    <div id="tRes" class="hero" style="margin-top:12px;text-align:center"><div class="s mut">Impôt estimé</div><div class="amount" id="tOut">0 €</div></div>
    <p class="s mut">Barème officiel (revenus 2025).</p>
  </div>
  <div class="card"><h3>Plafonds d'épargne</h3>
    ${Object.entries(LIMITS).map(([k,v])=>`<div class="row"><span>${k.replace('_',' ')}</span><b>${eur(v)}</b></div>`).join('')}
  </div>`;
}

function vAI() {
  return `<div class="chat" id="chatBox">
    ${S.chat.length ? S.chat.map(m=>`<div class="bubble ${m.role==='user'?'u':'a'}">${m.text}</div>`).join('') : '<div class="bubble a">Bonjour ! Je suis ton assistant. Envoie-moi une photo de ton relevé ou pose-moi une question.</div>'}
  </div>
  <div style="height:80px"></div>
  <div class="composer">
    <label style="background:var(--card);border:1px solid var(--bd);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px">📎<input type="file" accept="image/*" hidden onchange="handleImg(this)"></label>
    <input id="aiInput" placeholder="Pose ta question…">
    <button onclick="sendAI()">➤</button>
  </div>`;
}

function vSettings() {
  return `<div class="card"><h3>Clé API DeepSeek</h3>
    <p class="s mut">Nécessaire pour l'IA. Obtiens-la sur platform.deepseek.com.</p>
    <input type="password" value="${S.apiKey}" placeholder="sk-..." onchange="S.apiKey=this.value;save()">
  </div>
  <div class="card"><h3>Sauvegarde</h3>
    <p class="s mut">Exporte tes données pour les garder.</p>
    <button class="btn" onclick="exportData()">Exporter (JSON)</button>
    <button class="btn dn" onclick="if(confirm('Tout effacer ?')){localStorage.removeItem('patrimoine-v6');location.reload()}">Réinitialiser</button>
  </div>`;
}

// --- ACTIONS ---
function addAcc() { let n=document.getElementById('aName').value, t=document.getElementById('aType').value, b=Number(document.getElementById('aBal').value); if(n&&b){S.accounts.push({id:Date.now(),name:n,type:t,balance:b});save();} }
function addLoan() { let n=document.getElementById('lName').value, c=Number(document.getElementById('lCap').value); if(n&&c){S.loans.push({id:Date.now(),name:n,capital:c});save();} }
function addTx() { let l=document.getElementById('txLabel').value, a=Number(document.getElementById('txAmt').value), c=document.getElementById('txCat').value; if(l&&a){S.transactions.push({id:Date.now(),date:cur,label:l,amount:a,category:c});save();} }
function calcT() { let r=Number(document.getElementById('tRev').value); document.getElementById('tOut').textContent = eur(calcTax(r)); }
function exportData() { let d = "data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S)); let a=document.createElement('a'); a.href=d; a.download='sauvegarde_patrimoine.json'; a.click(); }

async function sendAI() {
  let input=document.getElementById('aiInput'), text=input.value.trim();
  if(!text||busy) return;
  input.value=''; S.chat.push({role:'user',text}); save();
  busy=true; let res = await askAI(text);
  S.chat.push({role:'assistant',text:res}); busy=false; save();
  document.getElementById('chatBox').scrollTop = 9999;
}
function handleImg(i) {
  if(!i.files[0]) return; let r=new FileReader();
  r.onload = async e => {
    S.chat.push({role:'user',text:'📎 Image envoyée'}); save(); busy=true;
    let res = await askAI("Analyse cette image. Extrais les dépenses et ajoute-les.", true, e.target.result);
    S.chat.push({role:'assistant',text:res}); busy=false; save();
  }; r.readAsDataURL(i.files[0]);
}

// --- NAVIGATION ---
const NAV = [['home','Synthèse'],['accounts','Comptes'],['budget','Budget'],['ai','Assistant']];
const ICONS = {home:'<rect x="3" y="3" width="8" height="8"/>',accounts:'<rect x="3" y="10" width="4" height="10"/>',budget:'<circle cx="12" cy="12" r="9"/>',ai:'<path d="M12 2l3 6 6 3-6 3-3 6-3-6-6-3 6-3z"/>'};
function go(t) { tab=t; draw(); window.scrollTo(0,0); }
function draw() {
  let html = '';
  if(tab==='home') html=vHome();
  if(tab==='accounts') html=vAccounts();
  if(tab==='budget') html=vBudget();
  if(tab==='tax') html=vTax();
  if(tab==='ai') html=vAI();
  if(tab==='settings') html=vSettings();

  document.getElementById('app').innerHTML = `
    <div class="top"><button class="avatar" onclick="toggleMenu()">☰</button><h1>${tab.toUpperCase()}</h1><button class="avatar" onclick="S.hide=!S.hide;save()">${S.hide?'🙈':'👁'}</button></div>
    ${html}
  `;
  document.getElementById('nav').innerHTML = NAV.map(([id,l])=>`<button class="${tab===id?'on':''}" onclick="go('${id}')"><svg viewBox="0 0 24 24">${ICONS[id]}</svg>${l}</button>`).join('');
}
function toggleMenu() {
  let el = document.getElementById('drawerRoot');
  if(el.innerHTML) { el.innerHTML=''; return; }
  let items = [['home','🏠 Synthèse'],['accounts','💳 Comptes & Dettes'],['budget','🥧 Budget'],['tax','🧾 Impôts'],['ai','✨ Assistant IA'],['settings','⚙️ Réglages']];
  el.innerHTML = `<div class="drawer-bg" onclick="toggleMenu()"></div><div class="drawer"><h2>Menu</h2>${items.map(([id,l])=>`<button onclick="toggleMenu();go('${id}')">${l}</button>`).join('')}</div>`;
}
draw();
</script>
</body>
</html>
