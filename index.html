</style></head><body><div id="app"></div><button id="fab" onclick="go('quick')" style="display:none">+</button><nav id="nav"></nav><div id="dr"></div>
<script id="app-js">
const K='patrimoine-v13',COL=['#f0c08a','#3ccf86','#6f7bf0','#d46bd8','#f2813c','#2fb5c9'];
const $=s=>document.querySelector(s);
function def(){return{accs:[{id:'pea',n:'PEA',l:[{id:'pea1',n:'Titres'},{id:'pea2',n:'Espèces'}]},{id:'cto1',n:'CTO – part 1',l:[{id:'c11',n:'Titres'},{id:'c12',n:'Espèces'}]},{id:'cto2',n:'CTO – part 2',l:[{id:'c21',n:'Titres'},{id:'c22',n:'Espèces'}]},{id:'liv',n:'Livret A',l:[{id:'liv1',n:'Solde'}]}],m:{},apiKey:''}}
function load(){try{const r=localStorage.getItem(K);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.accs)&&o.m&&typeof o.m=='object')return o}}catch(e){}return def()}
let S=load(),tab='home',armed=null;S.goal=S.goal||0;
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
let cur=ym(new Date());
const keys=()=>Object.keys(S.m).filter(k=>!S.m[k].c).sort();
function ensure(m){if(S.m[m])return;const p=Object.keys(S.m).filter(k=>k<m).sort().pop();S.m[m]=p?{v:JSON.parse(JSON.stringify(S.m[p].v)),d:{},c:1}:{v:{},d:{},c:1};save()}
const lv=(m,id)=>(S.m[m]&&S.m[m].v[id])||0;
const at=(m,a)=>a.l.reduce((s,l)=>s+lv(m,l.id),0);
const tot=m=>S.accs.reduce((s,a)=>s+at(m,a),0);
const dep=(m,a)=>(S.m[m]&&S.m[m].d[a.id])||0;
const prv=m=>keys().filter(k=>k<m).pop();
function gain(m,a){const p=prv(m);return p?at(m,a)-at(p,a)-dep(m,a):null}
function gainT(m){const p=prv(m);return p?tot(m)-tot(p)-S.accs.reduce((s,a)=>s+dep(m,a),0):null}
const eur=(n,d=0)=>S.hide?'••••• €':n.toLocaleString('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:d,maximumFractionDigits:d});
const pct=n=>(n>=0?'+':'')+n.toLocaleString('fr-FR',{maximumFractionDigits:2})+' %';
const mlabel=m=>{const[y,mo]=m.split('-');return new Date(y,mo-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?0:n};
const uid=()=>'x'+Math.random().toString(36).slice(2,8);
function gtxt(g,b){if(g==null)return'<span class="mut">—</span>';return`<span class="${g>=0?'up':'dn'}">${g>=0?'+':''}${eur(g)}${b>0?' ('+pct(g/b*100)+')':''}</span>`}
function chartOld(f=tot){const ks=keys().slice(-(S.rng||999));if(ks.length<2)return'<p class="mut s">La courbe apparaîtra dès que deux mois seront saisis.</p>';
const vs=ks.map(f),mn=Math.min(...vs),mx=Math.max(...vs),W=320,H=130,r=mx-mn||1;
const P=vs.map((v,i)=>[10+i*(W-20)/(ks.length-1),H-15-(v-mn)/r*(H-35)]);
const d=P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
return`<svg viewBox="0 0 ${W} ${H}" width="100%"><path d="${d}L${P[P.length-1][0]} ${H-5}L${P[0][0]} ${H-5}Z" fill="var(--ac)" opacity=".14"/><path d="${d}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>${P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--ac)"/>`).join('')}</svg><div class="ft mut s"><span>${mlabel(ks[0])}</span><span>${mlabel(ks[ks.length-1])}</span></div>`}
function donut(){const t=tot(cur);if(t<=0)return'<div class="dw"><svg viewBox="0 0 100 100" width="130"><circle r="40" cx="50" cy="50" fill="none" stroke="var(--bd)" stroke-width="16"/></svg><p class="s mut">Ajoute tes comptes et tes soldes pour voir ta répartition.</p></div>';let o=0;const R=40,C=2*Math.PI*R;
const seg=S.accs.map((a,i)=>{const f=at(cur,a)/t;const s=`<circle r="${R}" cx="50" cy="50" fill="none" stroke="${COL[i%6]}" stroke-width="16" stroke-dasharray="${f*C} ${C}" stroke-dashoffset="${-o*C}" transform="rotate(-90 50 50)"/>`;o+=f;return s}).join('');
return`<div class="dw"><svg viewBox="0 0 100 100" width="130">${seg}</svg><div>${S.accs.map((a,i)=>`<div class="lg"><i style="background:${COL[i%6]}"></i>${esc(a.n)} <b>${(at(cur,a)/t*100).toFixed(1).replace('.',',')} %</b></div>`).join('')}</div></div>`}
function list(){return S.accs.map((a,i)=>{const p=prv(cur);return`<div class="row" onclick="go('${a.id}')"><span><i class="dot" style="background:${COL[i%6]}"></i>${esc(a.n)}</span><span><b>${eur(at(cur,a))}</b><br><span class="s">${gtxt(gain(cur,a),p?at(p,a):0)}</span></span></div>`}).join('')}
function home(){const t=tot(cur),p=prv(cur);
return(tot(cur)==0&&!keys().length?'<div class="card"><h3>Bienvenue 👋</h3><p class="s">1. Ouvre <b>Comptes</b> et saisis le solde de chaque ligne (titres, espèces…).<br>2. Chaque mois, mets les soldes à jour et note tes versements.<br>3. Renseigne <b>Budget</b> et <b>Crédits</b> pour un tableau de bord complet.</p></div>':'')+`<div class="card"><div class="mut">Patrimoine net (brut − dettes)</div><div class="big">${eur(t-debt())}</div><div class="s mut">Brut ${eur(t)} · Dettes ${eur(debt())}</div><div>${p?gtxt(gainT(cur),tot(p))+' <span class="mut s">vs '+mlabel(p)+', hors versements</span>':'<span class="mut s">Premier mois saisi</span>'}</div></div>
${kpis()}<div class="card"><h3>Évolution</h3><div style="display:flex;gap:6px;margin-bottom:8px">${[[0.25,'1S'],[1,'1M'],[3,'3M'],[6,'6M'],[12,'1A'],[0,'Tout']].map(r=>`<button class="pill ${(S.rng||0)==r[0]?'on':''}" onclick="S.rng=${r[0]};save();draw()">${r[1]}</button>`).join('')}</div>${chart()}</div>
<div class="card"><h3>Répartition</h3>${donut()}</div>${tipsCard()}${goal()}<div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn" style="margin:0;padding:12px 4px;font-size:14px;min-width:0" onclick="go('hist')">📊 Historique</button><button class="btn" style="margin:0;padding:12px 4px;font-size:14px;min-width:0" onclick="go('sim')">🧮 Simulateurs</button><button class="btn" style="margin:0;padding:12px 4px;font-size:14px;min-width:0" onclick="go('tax')">🧾 Impôts</button></div><div hidden class="card"><h3>Répartition</h3>${donut()||'<p class="mut s">Saisis tes soldes dans l’onglet Comptes pour voir la répartition.</p>'}</div>`}
function med(a){a=a.slice().sort((x,y)=>x-y);const n=a.length;return n?(n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2):0}
function goal(){const t=tot(cur),g=S.goal||0,r=S.rate==null?5:S.rate;
let h=`<div class="card"><h3>Objectif de patrimoine</h3><div class="ln"><input class="nm" inputmode="decimal" placeholder="Montant cible (€)" value="${g||''}" onchange="S.goal=num(this.value);save();draw()"><input class="vl" style="width:70px" inputmode="decimal" value="${r}" onchange="S.rate=num(this.value);save();draw()"><span class="mut s" style="align-self:center">% /an</span></div>`;
if(g>0){const f=Math.min(100,t/g*100);h+=`<div style="height:10px;border-radius:6px;background:var(--bd);overflow:hidden"><div style="width:${f}%;height:100%;background:var(--ac)"></div></div><p class="s">${f.toFixed(1).replace('.',',')} % atteint · reste ${eur(Math.max(0,g-t))}</p>`;
if(t>=g)h+='<p class="up">Objectif atteint 🎉</p>';else{const md=med(keys().slice(-6).map(k=>S.accs.reduce((s,a)=>s+dep(k,a),0)));let v=t,n=0;while(v<g&&n<600){v=v*(1+r/1200)+md;n++}
h+=n>=600?'<p class="mut s">Hors de portée avec ces hypothèses : augmente les versements ou le rendement.</p>':`<p class="s">Estimation : <b>${new Date(cur.slice(0,4),+cur.slice(5)-1+n,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</b> (dans ${n>=12?Math.floor(n/12)+' an'+(n>=24?'s':'')+' ':''}${n%12?n%12+' mois':''}) avec ${eur(md)}/mois de versements et ${r} % par an.</p>`}}
else h+='<p class="mut s">Indique un montant cible et un rendement annuel estimé pour obtenir une projection.</p>';
return h+'</div>'}
function stats(){const ks=keys();if(ks.length<2)return'';const f=ks[0],l=ks[ks.length-1];
const dp=ks.slice(1).reduce((s,k)=>s+S.accs.reduce((q,a)=>q+dep(k,a),0),0);
const g=tot(l)-tot(f)-dp,gs=ks.slice(1).map(k=>[k,gainT(k)]).sort((a,b)=>b[1]-a[1]);
return`<div class="card"><h3>Bilan depuis ${mlabel(f)}</h3><div class="row"><span>Versements</span><b>${eur(dp)}</b></div><div class="row"><span>Gains</span>${gtxt(g,tot(f)+dp)}</div><div class="row"><span>Rendement annualisé</span><b>${rd()}</b></div><div class="row"><span>Meilleur mois</span><span>${mlabel(gs[0][0])}<br>${gtxt(gs[0][1],0)}</span></div><div class="row"><span>Pire mois</span><span>${mlabel(gs[gs.length-1][0])}<br>${gtxt(gs[gs.length-1][1],0)}</span></div></div>`}
function hist(){const ks=keys().slice().reverse();
return`<div class="card"><h3>Historique mensuel</h3>${ks.length<2?'<p class="mut s">Saisis au moins deux mois pour voir l’historique.</p>':''}`+ks.map(k=>{const p=prv(k),d=S.accs.reduce((s,a)=>s+dep(k,a),0);return`<div class="row" onclick="setM('${k}');go('home')"><span>${mlabel(k)}<br><span class="s mut">versé ${eur(d)}</span></span><span><b>${eur(tot(k))}</b><br><span class="s">${gtxt(gainT(k),p?tot(p):0)}</span></span></div>`}).join('')+'</div>'+stats()}
const CAT=[['alim','Alimentation / courses','B'],['log','Logement & énergie','B'],['car','Carburant','B'],['ass','Assurances','B'],['sante','Santé','B'],['trans','Transports & auto','B'],['resto','Restauration','E'],['abo','Abonnements & télécoms','E'],['shop','Shopping','E'],['loi','Loisirs','E'],['aut','Autres','E']];
const W=()=>{S.bud=S.bud||{};if(!S.bud[cur])S.bud[cur]=JSON.parse(JSON.stringify(bm(cur)));return S.bud[cur]};
const bm=m=>{if(!S.bud)return{r:0,c:{}};if(S.bud[m])return S.bud[m];const p=Object.keys(S.bud).filter(k=>k<m).sort().pop();return p?S.bud[p]:{r:0,c:{}}};
const cs=(m,t)=>CAT.filter(c=>!t||c[2]==t).reduce((s,c)=>s+(bm(m).c[c[0]]||0),0);
const epg=m=>S.accs.reduce((s,a)=>s+Math.max(0,dep(m,a)),0);
function sbud(k,v){W().c[k]=num(v);save();draw()}
function srev(v){W().r=num(v);save();draw()}
function sankey(){const b=bm(cur),rev=b.r,ep=epg(cur),it=CAT.map((c,i)=>[c[1],b.c[c[0]]||0,COL[i%6]]).filter(x=>x[1]>0);
if(ep>0)it.push(['Épargne virée',ep,'#3ccf86']);const out=it.reduce((s,x)=>s+x[1],0),rest=rev-out;if(rest>0)it.push(['Reste',rest,'#8b93a1']);
const T=Math.max(rev,out);if(T<=0)return'<p class="mut s">Saisis tes revenus et tes dépenses du mois pour voir le flux.</p>';
const k=220/T,x0=14,x1=326;let ly=0,ry=0,P='',N='';
it.forEach(x=>{const hl=x[1]*k,hr=Math.max(hl,9);
P+=`<path d="M${x0} ${ly}C170 ${ly} 170 ${ry} ${x1} ${ry}L${x1} ${ry+hr}C170 ${ry+hr} 170 ${ly+hl} ${x0} ${ly+hl}Z" fill="${x[2]}" opacity=".4"/>`;
N+=`<rect x="${x1}" y="${ry}" width="7" height="${hr}" fill="${x[2]}"/><text x="${x1-4}" y="${ry+hr/2+3}" text-anchor="end" font-size="9.5" fill="var(--tx)">${esc(x[0])} : ${eur(x[1])}</text>`;ly+=hl;ry+=hr+2});

let CH=[],BUSY=false;
async function askAI(prompt, isImg=false, imgData=null){
  if(!S.apiKey) return "⚠️ Clé API DeepSeek manquante dans Réglages.";
  if(isImg) return "⚠️ Le modèle DeepSeek ne lit pas les images pour l'instant. Écris ta demande.";
  const sys = `Tu es l'expert financier intégré à cette application. État actuel : ${JSON.stringify(S.accs)}. 
  Si l'utilisateur demande d'ajouter une dépense, réponds EXACTEMENT [ACTION: {"label":"Nom","amount":50}]. 
  Sinon, réponds normalement en français.`;
  try {
    let r = await fetch("https://api.deepseek.com/v1/chat/completions", {
      method: "POST", headers: {"Content-Type": "application/json", "Authorization": `Bearer ${S.apiKey}`},
      body: JSON.stringify({ model: "deepseek-chat", messages: [{role:"system", content:sys},{role:"user", content:prompt}], temperature: 0.1 })
    });
    let d = await r.json();
    if(d.error) throw new Error(d.error.message);
    let txt = d.choices[0].message.content;
    if(txt.includes('[ACTION:')){
      try {
        let a = JSON.parse(txt.split('[ACTION:')[1].split(']')[0]);
        S.m[cur].expenses = S.m[cur].expenses || {};
        S.m[cur].expenses[a.label] = (S.m[cur].expenses[a.label] || 0) + a.amount;
        save(); return `✅ Dépense enregistrée : ${esc(a.label)} (${eur(a.amount)})`;
      } catch(e) { return txt; }
    }
    return txt;
  } catch(e) { return "❌ Erreur API : " + e.message; }
}

  document.getElementById('app').innerHTML=`
  <header><button class="av" onclick="drawer(1)">☰</button><h1>${tab==='home'?'Synthèse':tab==='accs'?'Comptes':tab==='tax'?'Impôts':tab==='ai'?'Assistant':tab==='set'?'Réglages':'Patrimoine'}</h1><button class="av" onclick="S.hide=!S.hide;save()">${S.hide?'🙈':'👁'}</button></header>
  <div class="mn"><button onclick="setM(addM(cur,-1))">‹</button><label class="mp">${mlabel(cur)} ▾<input type="month" value="${cur}" onchange="setM(this.value)"></label><button onclick="setM(addM(cur,1))">›</button></div>
  ${tab==='home'?home():tab==='accs'?accs():tab==='tax'?tax():tab==='ai'?ai():tab==='set'?set():tab==='quick'?quick():A(tab)?acc(A(tab)):home()}`;
  $('#nav').innerHTML=[['home','Synthèse'],['accs','Comptes'],['tax','Impôts'],['ai','Assistant']].map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')"><svg viewBox="0 0 24 24">${t[0]==='home'?'<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>':t[0]==='accs'?'<rect x="4" y="10" width="4" height="10" rx="2"/><rect x="10" y="4" width="4" height="16" rx="2"/><rect x="16" y="13" width="4" height="7" rx="2"/>':t[0]==='tax'?'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 9h8M8 15h5" stroke="var(--card)" stroke-width="2" stroke-linecap="round"/>':'<path d="M12 2l2.2 6.3L21 10l-6.8 1.7L12 18l-2.2-6.3L3 10l6.8-1.7z"/>'}</svg>${t[1]}</button>`).join('');
  $('#fab').style.display=['home','accs'].includes(tab)?'block':'none';
  drawChat();
}

function acc(a){const p=prv(cur);return`<button class="btn" style="margin:0 0 14px" onclick="go('accs')">← Comptes</button><div class="card"><div class="mut">${esc(a.n)}</div><div class="big">${eur(at(cur,a))}</div><div>${p?gtxt(gain(cur,a),at(p,a)):''}</div></div><div class="card"><h3>Lignes</h3>${a.l.map(l=>`<div class="ln"><input class="nm" value="${esc(l.n)}" onchange="rn('${a.id}','${l.id}',this.value)"><input class="vl" inputmode="decimal" value="${lv(cur,l.id)||''}" placeholder="0" oninput="sv('${l.id}',this.value,1)" onchange="sv('${l.id}',this.value)"><button class="x" onclick="dl('${a.id}','${l.id}')">×</button></div>`).join('')}<button class="btn" onclick="al('${a.id}')">+ Ligne</button></div><div class="card"><h3>Versement</h3><input class="vl w" inputmode="decimal" value="${dep(cur,a)||''}" placeholder="0" oninput="sd('${a.id}',this.value,1)" onchange="sd('${a.id}',this.value)"></div><button class="btn red" onclick="da('${a.id}')">Supprimer</button>`}
function accs(){return`<div class="card"><h3>Mes Comptes</h3>${list()}</div>`+addCard()}
function tax(){return`<div class="card"><h3>Simulateur d'Impôt</h3><input id="taxRev" type="number" placeholder="Revenu net imposable (€)" oninput="calcT()"><div class="big" id="taxOut" style="text-align:center;margin-top:12px">0 €</div></div><div class="card"><h3>Plafonds</h3><div class="row" style="cursor:default"><span>PEA</span><b>${eur(150000)}</b></div><div class="row" style="cursor:default"><span>Livret A</span><b>${eur(22950)}</b></div></div>`}
function calcT(){let q=num($('#taxRev').value),tax=0,prev=0;for(let b of [[11600,0],[29579,.11],[84577,.3],[181917,.41],[1e12,.45]]){let tx=Math.max(0,Math.min(q,b[0])-prev);tax+=tx*b[1];prev=b[0];if(q<=b[0])break}if(tax<2500)tax-=Math.max(0,897-0.4525*tax);$('#taxOut').textContent=eur(Math.max(0,Math.round(tax)))}

function drawer(o){const e=document.getElementById('dr');if(!o){e.innerHTML='';return}e.innerHTML=`<div class="dro" onclick="drawer(0)"></div><div class="drp"><h2 style="margin:0 0 10px;color:var(--ac)">Menu</h2>${[['home','🏠 Synthèse'],['accs','💳 Comptes'],['tax','🧾 Impôts'],['ai','✨ Assistant'],['set','⚙️ Réglages']].map(m=>`<button class="dri ${m[0]==tab?'on':''}" onclick="drawer(0);go('${m[0]}')"><span>${m[1]}</span></button>`).join('')}</div>`}

ensure(cur);draw();
</script></body></html>
