<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patrimoine Pro</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Patrimoine">
<meta name="theme-color" content="#0a0a0b">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0a0b'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23f0c08a' font-family='sans-serif'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0a0a0b;--card:#131417;--card2:#1a1b1f;--tx:#f4f5f7;--mut:#8a8f98;--bd:#24262c;--ac:#f0c08a;--ac2:#b8791a;--on:#1a1306;--up:#3ccf86;--dn:#ff6f66;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:110px;overflow-x:hidden}
#app{max-width:680px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.top h1{font-size:19px;margin:0;color:var(--ac);font-weight:600;letter-spacing:-.3px}
.top .avatar{width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.top .avatar:active{transform:scale(.95)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.card h3{margin:0 0 14px;font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;color:var(--tx)}
.card .sub{color:var(--mut);font-size:14px;line-height:1.5;margin:0}
.hero{background:linear-gradient(145deg,var(--card) 0%,var(--card2) 100%);border:1px solid var(--bd);border-radius:26px;padding:24px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(240,192,138,.05) 0%,transparent 60%);pointer-events:none}
.hero .label{font-size:13px;color:var(--mut);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.hero .amount{font-size:42px;font-weight:700;letter-spacing:-1.5px;line-height:1.1;margin-bottom:8px}
.hero .detail{font-size:14px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px}
.kpi .k{font-size:12px;color:var(--mut);margin-bottom:8px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-1px}
.kpi .s{font-size:12px;color:var(--mut);margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--bd);text-align:right}
.row:first-of-type{border-top:0;padding-top:0}
.row>span:first-child{text-align:left;display:flex;align-items:center;gap:12px;font-weight:500;max-width:65%}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}.s{font-size:13px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:14px;width:100%;margin-bottom:12px;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.btn{width:100%;padding:16px;border-radius:18px;border:1px solid var(--bd);background:var(--card);color:var(--ac);font:inherit;font-weight:600;cursor:pointer;margin-top:12px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ac);color:var(--on);border-color:transparent}
.btn.red{color:var(--dn);border-color:color-mix(in srgb,var(--dn) 30%,transparent)}
#nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:32px;padding:6px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;font-weight:500;padding:8px 2px;border-radius:26px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:all .2s}
#nav button.on{background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac)}
#nav svg{width:22px;height:22px;fill:currentColor}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.drawer{position:fixed;left:0;top:0;bottom:0;width:84%;max-width:340px;background:var(--card);border-right:1px solid var(--bd);padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;overflow:auto;z-index:61;transform:translateX(-100%);transition:transform .3s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;gap:6px}
.drawer.open{transform:translateX(0)}
.drawer h2{margin:0 0 20px;font-size:22px;color:var(--ac);font-weight:700}
.drawer .item{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:var(--tx);font:inherit;font-size:16px;padding:16px;border-radius:16px;text-align:left;cursor:pointer;transition:background .2s}
.drawer .item.on{background:color-mix(in srgb,var(--ac) 10%,transparent);color:var(--ac)}
.chat{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.bubble{max-width:88%;padding:14px 18px;border-radius:22px;font-size:15px;white-space:pre-wrap;word-break:break-word;line-height:1.5}
.bubble.u{align-self:flex-end;background:var(--ac);color:var(--on);border-bottom-right-radius:6px}
.bubble.a{align-self:flex-start;background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:6px}
.composer{position:fixed;left:14px;right:14px;bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;z-index:40}
.composer input{margin:0;flex:1;min-width:0;border-radius:999px;padding:14px 20px;background:var(--card);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.composer .send{width:50px;height:50px;border-radius:50%;border:0;background:var(--ac);color:var(--on);font-size:20px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="drawerRoot"></div>
<nav id="nav"></nav>
<script>
// --- CONSTANTES FISCALES ---
const LEGAL = {
  taxBrackets: [{max:11600,rate:0},{max:29579,rate:0.11},{max:84577,rate:0.30},{max:181917,rate:0.41},{max:Infinity,rate:0.45}],
  plafonds:{pea:150000,livretA:22950,ldds:12000,lep:10000}
};
const COL = ['#f0c08a','#3ccf86','#6f7bf0','#d46bd8','#f2813c','#2fb5c9'];
const TITLES = {home:'Synthèse', accounts:'Comptes', budget:'Budget', tax:'Impôts', ai:'Assistant', settings:'Réglages'};

// --- DONNÉES ET INITIALISATION ---
const DEFAULT = () => ({
  accounts: [{id:'1',name:'Livret A',type:'epargne',balance:15000},{id:'2',name:'PEA',type:'invest',balance:25000}],
  loans: [{id:'l1',name:'Prêt Immo',capital:150000,rate:1.5,months:240,start:'2021-01'}],
  transactions: [], chat: [], apiKey: '', hide: false, history: {}
});
let S = load(), tab = 'home', cur = new Date().toISOString().slice(0,7), busy = false, drawerOpen = false;

function load(){ try{ const r=localStorage.getItem('patrimoine-v9'); if(r) return JSON.parse(r); }catch(e){} return DEFAULT(); }
function save(){ 
  S.history = S.history || {};
  S.history[cur] = getNetWorth();
  try{ localStorage.setItem('patrimoine-v9',JSON.stringify(S)); }catch(e){} 
  draw(); 
}
const eur = (n) => S.hide ? '••••€' : Number(n).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const num = (v) => parseFloat(v) || 0;
const uid = () => Math.random().toString(36).substr(2,9);
const esc = (s) => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// --- CALCULS ---
function calcTax(rev, parts=1){
  let q = rev/parts, tax = 0, prev = 0;
  for(let b of LEGAL.taxBrackets){
    let tx = Math.max(0, Math.min(q,b.max)-prev);
    tax += tx*b.rate; prev = b.max;
    if(q<=b.max) break;
  }
  let finalTax = tax*parts;
  if(finalTax < 2500) finalTax -= Math.max(0, (parts>1?1483:897) - 0.4525*finalTax);
  return Math.max(0, Math.round(finalTax));
}
function calcLoan(L){
  let i=L.rate/1200, n=L.months;
  let mens = i ? L.capital*i/(1-Math.pow(1+i,-n)) : L.capital/n;
  let elapsed = (new Date(cur).getFullYear() - new Date(L.start).getFullYear())*12 + (new Date(cur).getMonth() - new Date(L.start).getMonth());
  elapsed = Math.max(0, Math.min(n, elapsed));
  let rest = i ? L.capital*(Math.pow(1+i,n)-Math.pow(1+i,elapsed))/(Math.pow(1+i,n)-1) : L.capital*(1-elapsed/n);
  return { mens, rest: Math.max(0,rest) };
}
const getTotalAssets = () => S.accounts.reduce((s,a)=>s+a.balance, 0);
const getTotalDebt = () => S.loans.reduce((s,l)=>s+calcLoan(l).rest, 0);
const getNetWorth = () => getTotalAssets() - getTotalDebt();

// --- AGENT IA (DEEPSEEK) ---
async function askAI(prompt){
  if(!S.apiKey) return "⚠️ Clé API DeepSeek manquante dans les Réglages.";
  const sys = `Tu es un robot financier intégré qui AGIT sur les données. Voici l'état actuel : ${JSON.stringify(S.accounts)}.
  Si l'utilisateur te demande d'ajouter une dépense, réponds UNIQUEMENT avec : [ACTION: {"type":"add_expense","label":"Nom","amount":50,"category":"Alimentation"}]
  Si l'utilisateur te demande d'ajouter un compte, réponds UNIQUEMENT avec : [ACTION: {"type":"add_account","name":"Nom","balance":1000,"accType":"epargne"}]
  Si l'utilisateur te demande de modifier un solde, réponds UNIQUEMENT avec : [ACTION: {"type":"update_balance","name":"Nom du compte","balance":2000}]
  Sinon, réponds normalement de façon concise en français.`;

  try{
    let r = await fetch("https://api.deepseek.com/v1/chat/completions", {
      method:"POST", headers:{"Content-Type":"application/json","Authorization":`Bearer ${S.apiKey}`},
      body: JSON.stringify({model:"deepseek-chat", messages:[{role:"system",content:sys},{role:"user",content:prompt}], temperature:0.1})
    });
    let d = await r.json();
    if(d.error) throw new Error(d.error.message);
    let txt = d.choices[0].message.content;

    if(txt.includes('[ACTION:')){
      try {
        let cleanStr = txt.replace(/```json/g, '').replace(/```/g, '').trim();
        let jsonStr = cleanStr.split('[ACTION:')[1].split(']')[0];
        let act = JSON.parse(jsonStr);
        
        if(act.type === 'add_expense'){
          S.transactions.push({id:uid(), date:cur, label:act.label, amount:act.amount, category:act.category});
          save(); return `✅ Dépense enregistrée : **${esc(act.label)}** (${eur(act.amount)}) dans ${act.category}.`;
        }
        if(act.type === 'add_account'){
          S.accounts.push({id:uid(), name:act.name, type:act.accType||'cash', balance:act.balance});
          save(); return `✅ Compte créé : **${esc(act.name)}** avec ${eur(act.balance)}.`;
        }
        if(act.type === 'update_balance'){
          let acc = S.accounts.find(a => a.name.toLowerCase().includes(act.name.toLowerCase()));
          if(acc){ acc.balance = act.balance; save(); return `✅ Solde de **${esc(acc.name)}** mis à jour à ${eur(act.balance)}.`; }
          else return `❌ Je n'ai pas trouvé le compte "${esc(act.name)}".`;
        }
      } catch(e) { return txt; }
    }
    return txt;
  } catch(e){ return "❌ Erreur API : " + e.message; }
}

// --- GRAPHIQUES ---
function chartLine(){
  let hist = Object.entries(S.history || {}).sort((a,b)=>a[0].localeCompare(b[0]));
  if(hist.length < 2) return '<p class="sub">La courbe apparaîtra dès que tu auras enregistré des données sur 2 mois différents.</p>';
  let vs = hist.map(h=>h[1]), mn=Math.min(...vs), mx=Math.max(...vs), r=mx-mn||1, W=340, H=120;
  let pts = vs.map((v,i)=>[12+i*(W-24)/(vs.length-1), H-20-(v-mn)/r*(H-40)]);
  let d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><path d="${d}L${pts[pts.length-1][0]} ${H-10}L${pts[0][0]} ${H-10}Z" fill="var(--ac)" opacity=".1"/><path d="${d}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}
function chartDonut(){
  let t = getTotalAssets(); if(t<=0) return '';
  const R=40, C=2*Math.PI*R; let off=0;
  const segs = S.accounts.map((a,i)=>{ const f=a.balance/t; const s=`<circle r="${R}" cx="50" cy="50" fill="none" stroke="${COL[i%COL.length]}" stroke-width="12" stroke-dasharray="${f*C} ${C}" stroke-dashoffset="${-off*C}" transform="rotate(-90 50 50)"/>`; off+=f; return s; }).join('');
  const legend = S.accounts.map((a,i)=>`<div style="display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px"><span class="dot" style="background:${COL[i%COL.length]}"></span><span style="flex:1;color:var(--mut)">${esc(a.name)}</span><b>${(a.balance/t*100).toFixed(0)}%</b></div>`).join('');
  return `<div style="display:flex;align-items:center;gap:20px"><svg viewBox="0 0 100 100" width="100" height="100">${segs}</svg><div style="flex:1">${legend}</div></div>`;
}

// --- VUES ---
function vHome(){
  let net = getNetWorth(), assets = getTotalAssets(), debt = getTotalDebt();
  return `
  <div class="hero">
    <div class="label">Patrimoine Net</div>
    <div class="amount ${net>=0?'up':'dn'}">${eur(net)}</div>
    <div class="detail">Actifs : ${eur(assets)}<br>Dettes : ${eur(debt)}</div>
  </div>
  <div class="grid">
    <div class="kpi"><div class="k">Liquidités</div><div class="v">${eur(S.accounts.filter(a=>a.type==='cash').reduce((s,a)=>s+a.balance,0))}</div></div>
    <div class="kpi"><div class="k">Épargne</div><div class="v">${eur(S.accounts.filter(a=>a.type==='epargne').reduce((s,a)=>s+a.balance,0))}</div></div>
    <div class="kpi"><div class="k">Investi</div><div class="v">${eur(S.accounts.filter(a=>a.type==='invest').reduce((s,a)=>s+a.balance,0))}</div></div>
    <div class="kpi"><div class="k">Dépenses</div><div class="v">${eur(S.transactions.filter(t=>t.date===cur).reduce((s,t)=>s+t.amount,0))}</div></div>
  </div>
  <div class="card"><h3>Évolution</h3>${chartLine()}</div>
  <div class="card"><h3>Répartition</h3>${chartDonut()}</div>`;
}

function vAccounts(){
  return `
  <div class="card"><h3>🏦 Actifs</h3>
    ${S.accounts.map((a,i)=>`
      <div class="row">
        <span><span class="dot" style="background:${COL[i%COL.length]}"></span>${esc(a.name)}</span>
        <span><b>${eur(a.balance)}</b> <button onclick="delAcc('${a.id}')" style="border:0;background:none;color:var(--mut);font-size:18px;cursor:pointer">×</button></span>
      </div>
    `).join('')}
  </div>
  <div class="card"><h3>Ajouter un actif</h3>
    <input id="aName" placeholder="Nom (ex: Livret A)">
    <select id="aType"><option value="cash">Compte courant</option><option value="epargne">Épargne</option><option value="invest">Investissement</option></select>
    <input id="aBal" type="number" placeholder="Solde (€)">
    <button class="btn primary" onclick="addAcc()">+ Ajouter</button>
  </div>
  <div class="card"><h3>💳 Dettes</h3>
    ${S.loans.map((l,i)=>{
      let c = calcLoan(l);
      return `<div class="row"><span>${esc(l.name)}<br><span class="s mut">${l.rate}% / ${l.months}m</span></span><span><b class="dn">${eur(c.rest)}</b><br><span class="s mut">${eur(c.mens)}/m</span></span></div>`;
    }).join('')}
  </div>
  <div class="card"><h3>Ajouter un crédit</h3>
    <input id="lName" placeholder="Nom (ex: Prêt Immo)">
    <input id="lCap" type="number" placeholder="Capital (€)">
    <input id="lRate" type="number" step="0.1" placeholder="Taux (%)">
    <input id="lMonths" type="number" placeholder="Durée (mois)">
    <button class="btn primary" onclick="addLoan()">+ Ajouter</button>
  </div>`;
}

function vBudget(){
  const cats = ['Alimentation','Logement','Transport','Loisirs','Abonnements','Santé','Autres'];
  let spent = {}, txs = S.transactions.filter(t => t.date === cur);
  txs.forEach(t => { spent[t.category] = (spent[t.category]||0) + t.amount; });
  return `
  <div class="hero"><div class="label">Dépenses ce mois</div><div class="amount dn">${eur(Object.values(spent).reduce((a,b)=>a+b,0))}</div></div>
  <div class="card"><h3>Par catégorie</h3>
    ${cats.map((c,i)=>`<div class="row"><span><span class="dot" style="background:${COL[i%COL.length]}"></span>${c}</span><b>${eur(spent[c]||0)}</b></div>`).join('')}
  </div>
  <div class="card"><h3>Historique</h3>
    ${txs.length ? txs.slice().reverse().map(t=>`<div class="row"><span>${esc(t.label)} <span class="s mut">(${t.category})</span></span><span><b class="dn">-${eur(t.amount)}</b> <button onclick="delTx('${t.id}')" style="border:0;background:none;color:var(--mut);font-size:18px;cursor:pointer">×</button></span></div>`).join('') : '<p class="sub">Aucune transaction.</p>'}
  </div>
  <div class="card"><h3>Ajouter</h3>
    <input id="txLabel" placeholder="Libellé">
    <input id="txAmt" type="number" placeholder="Montant (€)">
    <select id="txCat">${cats.map(c=>`<option>${c}</option>`).join('')}</select>
    <button class="btn primary" onclick="addTx()">Enregistrer</button>
  </div>`;
}

function vTax(){
  return `
  <div class="card"><h3>🧾 Impôt sur le revenu (2026)</h3>
    <input id="taxRev" type="number" placeholder="Revenu net imposable (€)" oninput="updateTax()">
    <div style="padding:16px;background:var(--bg);border-radius:14px;text-align:center;margin-top:8px">
      <div class="s mut">Impôt estimé</div><div class="v up" id="taxOut" style="font-size:28px;font-weight:700">0 €</div>
    </div>
  </div>
  <div class="card"><h3>📊 Plafonds</h3>
    <div class="row"><span>PEA</span><b>${eur(LEGAL.plafonds.pea)}</b></div>
    <div class="row"><span>Livret A</span><b>${eur(LEGAL.plafonds.livretA)}</b></div>
    <div class="row"><span>LDDS</span><b>${eur(LEGAL.plafonds.ldds)}</b></div>
    <div class="row"><span>LEP</span><b>${eur(LEGAL.plafonds.lep)}</b></div>
  </div>`;
}

function vAI(){
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="margin:0;font-size:22px;color:var(--ac)">Assistant IA</h2>
    <button onclick="S.chat=[];save()" style="border:1px solid var(--bd);background:none;color:var(--mut);padding:6px 12px;border-radius:10px;cursor:pointer">Effacer</button>
  </div>
  <div id="chatBox" class="chat">
    ${S.chat.length ? S.chat.map(m=>`<div class="bubble ${m.role==='user'?'u':'a'}">${esc(m.text)}</div>`).join('') : `<div class="bubble a">Bonjour ! Je peux ajouter des dépenses, créer des comptes ou modifier tes soldes. Essaie : "Ajoute un PEA avec 5000€" ou "Ajoute 50€ en Loisirs".</div>`}
  </div>
  <div style="height:80px"></div>
  <div class="composer">
    <input id="aiInput" placeholder="Donne-moi un ordre…" onkeydown="if(event.key==='Enter')sendAI()">
    <button class="send" onclick="sendAI()">➤</button>
  </div>`;
}

function vSettings(){
  return `
  <div class="card"><h3>🔑 Clé API DeepSeek</h3>
    <p class="sub">Obtiens-la sur platform.deepseek.com.</p>
    <input type="password" value="${S.apiKey}" placeholder="sk-..." onchange="S.apiKey=this.value;save()">
  </div>
  <div class="card"><h3>💾 Sauvegarde</h3>
    <button class="btn primary" onclick="exportData()">Exporter mes données (JSON)</button>
    <label class="btn" style="text-align:center;display:block;cursor:pointer">Restaurer une sauvegarde<input type="file" accept=".json" hidden onchange="importData(this)"></label>
    <button class="btn red" style="margin-top:20px" onclick="if(confirm('Tout effacer ?')){localStorage.removeItem('patrimoine-v9');location.reload()}">Réinitialiser</button>
  </div>`;
}

// --- ACTIONS ---
function addAcc(){
  let n=document.getElementById('aName').value, t=document.getElementById('aType').value, b=num(document.getElementById('aBal').value);
  if(n && b>=0){ S.accounts.push({id:uid(), name:n, type:t, balance:b}); save(); }
}
function delAcc(id){ if(confirm('Supprimer ce compte ?')){ S.accounts = S.accounts.filter(a=>a.id!==id); save(); } }
function addLoan(){
  let n=document.getElementById('lName').value, c=num(document.getElementById('lCap').value), r=num(document.getElementById('lRate').value), m=num(document.getElementById('lMonths').value);
  if(n && c>0 && m>0){ S.loans.push({id:uid(), name:n, capital:c, rate:r, months:m, start:cur}); save(); }
}
function addTx(){
  let l=document.getElementById('txLabel').value, a=num(document.getElementById('txAmt').value), c=document.getElementById('txCat').value;
  if(l && a>0){ S.transactions.push({id:uid(), date:cur, label:l, amount:a, category:c}); save(); }
}
function delTx(id){ S.transactions = S.transactions.filter(t=>t.id!==id); save(); }
function updateTax(){ document.getElementById('taxOut').textContent = eur(calcTax(num(document.getElementById('taxRev').value))); }

function exportData(){
  let d = "data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S));
  let a = document.createElement('a'); a.href=d; a.download='sauvegarde_patrimoine.json'; a.click();
}
function importData(input){
  let f = input.files[0]; if(!f) return;
  let r = new FileReader();
  r.onload = e => {
    try {
      let data = JSON.parse(e.target.result);
      if(data.accounts && data.loans) { S = data; save(); alert('Sauvegarde restaurée !'); }
      else alert('Fichier invalide.');
    } catch(err) { alert('Erreur de lecture.'); }
  };
  r.readAsText(f);
}

async function sendAI(){
  let i = document.getElementById('aiInput'), t = i.value.trim();
  if(!t || busy) return;
  i.value=''; S.chat.push({role:'user', text:t}); save(); busy=true;
  let res = await askAI(t);
  S.chat.push({role:'assistant', text:res});
  busy=false; save();
  setTimeout(()=>{ let box=document.getElementById('chatBox'); if(box) box.scrollTop=box.scrollHeight; },100);
}

// --- NAVIGATION & RENDU ---
const NAV = [['home','Synthèse'],['accounts','Comptes'],['budget','Budget'],['ai','Assistant']];
const ICONS = {
  home:'<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>',
  accounts:'<rect x="4" y="10" width="4" height="10" rx="2"/><rect x="10" y="4" width="4" height="16" rx="2"/><rect x="16" y="13" width="4" height="7" rx="2"/>',
  budget:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 9h8M8 15h5" stroke="var(--card)" stroke-width="2" stroke-linecap="round"/>',
  ai:'<path d="M12 2l2.2 6.3L21 10l-6.8 1.7L12 18l-2.2-6.3L3 10l6.8-1.7z"/>'
};

function go(t){ tab=t; draw(); window.scrollTo(0,0); }
function draw(){
  let html = '';
  if(tab==='home') html = vHome();
  if(tab==='accounts') html = vAccounts();
  if(tab==='budget') html = vBudget();
  if(tab==='tax') html = vTax();
  if(tab==='ai') html = vAI();
  if(tab==='settings') html = vSettings();

  document.getElementById('app').innerHTML = `
    <div class="top">
      <button class="avatar" onclick="toggleDrawer()">☰</button>
      <h1>${TITLES[tab] || 'Patrimoine'}</h1>
      <button class="avatar" onclick="S.hide=!S.hide;save()">${S.hide?'🙈':'👁'}</button>
    </div>
    ${html}
  `;
  document.getElementById('nav').innerHTML = NAV.map(([id,l])=>`<button class="${tab===id?'on':''}" onclick="go('${id}')"><svg viewBox="0 0 24 24">${ICONS[id]}</svg>${l}</button>`).join('');
}

function toggleDrawer(){
  let el = document.getElementById('drawerRoot');
  if(drawerOpen){ el.innerHTML=''; drawerOpen=false; return; }
  drawerOpen = true;
  let items = [['home','🏠 Synthèse'],['accounts','💳 Comptes'],['budget','🥧 Budget'],['tax','🧾 Impôts'],['ai','✨ Assistant IA'],['settings','⚙️ Réglages']];
  el.innerHTML = `<div class="drawer-bg" onclick="toggleDrawer()"></div><div class="drawer open"><h2>Menu</h2>${items.map(([id,l])=>`<button class="item ${tab===id?'on':''}" onclick="toggleDrawer();go('${id}')">${l}</button>`).join('')}</div>`;
}

// Lancement
draw();
</script>
